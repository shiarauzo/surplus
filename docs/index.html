<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Surplus</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
      background: #000;
      color: #e7e7ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px 16px 40px;
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; }
    .by { margin: 0; color: #c5c5cb; font-size: 14px; }
    a { color: inherit; }
    .watch {
      width: min(230px, 72vw);
      aspect-ratio: 184 / 224;
      padding: 0;
      border: 0;
      border-radius: 42px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
    }
    .watch img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .caption { margin: 0; max-width: 280px; text-align: center; font-size: 15px; line-height: 1.35; }
    .row { display: flex; gap: 8px; }
    .row button, .dots button { font: inherit; cursor: pointer; }
    .row button {
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: #487dfa;
      color: #fff;
      font-weight: 700;
    }
    .row button:disabled { opacity: 0.35; }
    .dots { display: flex; gap: 6px; align-items: center; }
    .dots button {
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.4);
    }
    .dots button[aria-current="true"] { width: 18px; background: #fff; }
    button:focus-visible, .watch:focus-visible { outline: 2px solid #487dfa; outline-offset: 3px; }
    footer { margin: 0; max-width: 320px; color: #c5c5cb; font-size: 13px; text-align: center; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Surplus</h1>
  <p class="by">By <a href="https://github.com/shiarauzo">Shiara Arauzo</a></p>
  <button class="watch" type="button" id="watch" aria-label="Next screen">
    <img id="screen" src="images/splash.png" alt="Splash. The cart mark and the name." width="368" height="448">
  </button>
  <p class="caption" id="caption">The cart mark and the name.</p>
  <div class="dots" id="dots"></div>
  <div class="row">
    <button type="button" id="back">Back</button>
    <button type="button" id="next">Next</button>
  </div>
  <footer>
    These are the screens from the Apple Watch simulator.
    The app itself runs in Xcode from <a href="https://github.com/shiarauzo/surplus">the repository</a>.
  </footer>
  <script>
    const steps = [
      ["images/splash.png", "Splash", "The cart mark and the name."],
      ["images/map.png", "Map", "Nearby restaurants. The dots open the foods."],
      ["images/food.png", "Food", "X passes. The check means she wants it."],
      ["images/pay.png", "Pay", "The check reveals Pay."],
      ["images/cards.png", "Cards", "Three cards. Scroll, then tap one. Nothing is charged."],
      ["images/receipt.png", "Receipt", "The price, the dish, the time, and the restaurant."],
      ["images/empty.png", "Empty", "No restaurants nearby."]
    ];
    const screen = document.getElementById("screen");
    const caption = document.getElementById("caption");
    const dots = document.getElementById("dots");
    const back = document.getElementById("back");
    const next = document.getElementById("next");
    let index = 0;

    steps.forEach(function (step, stepIndex) {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.setAttribute("aria-label", step[1]);
      dot.addEventListener("click", function () { show(stepIndex); });
      dots.appendChild(dot);
    });

    function show(nextIndex) {
      index = nextIndex;
      const step = steps[index];
      screen.src = step[0];
      screen.alt = step[1] + ". " + step[2];
      caption.textContent = step[2];
      back.disabled = index === 0;
      next.disabled = index === steps.length - 1;
      Array.from(dots.children).forEach(function (dot, dotIndex) {
        if (dotIndex === index) dot.setAttribute("aria-current", "true");
        else dot.removeAttribute("aria-current");
      });
    }

    document.getElementById("watch").addEventListener("click", function () {
      if (index < steps.length - 1) show(index + 1);
    });
    back.addEventListener("click", function () { if (index > 0) show(index - 1); });
    next.addEventListener("click", function () { if (index < steps.length - 1) show(index + 1); });
    document.addEventListener("keydown", function (event) {
      if (event.key === "ArrowRight") next.click();
      if (event.key === "ArrowLeft") back.click();
    });
    show(0);
  </script>
</body>
</html>
